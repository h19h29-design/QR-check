<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <?!= include_('Styles'); ?>
</head>
<body>
  <main class="container">
    <h1>QR보안점검표 초기 설정</h1>
    <p class="notice">처음 설정할 때는 학교명, 관리자 Google 이메일, 초기 설정 키가 필요합니다. Apps Script 편집기에서 createInitialSetupKey 함수를 먼저 실행해 키를 발급받으세요.</p>
    <section class="panel">
      <label>초기 설정 키 <input id="setupKey" type="password" placeholder="createInitialSetupKey 실행 결과"></label>
      <label>학교명 <input id="schoolName" placeholder="예: 서울○○학교"></label>
      <label>관리자 Google 이메일 <input id="adminEmail" placeholder="admin@example.com"></label>
      <label>처음 점검할 장소 (한 줄에 하나, 최대 20곳)
        <textarea id="initialRooms" rows="4" placeholder="행정실&#10;교무실&#10;도서실"></textarea>
      </label>
      <label>현재 관리자 토큰 <input id="adminToken" type="password" placeholder="재실행 또는 토큰 재발급 시 입력"></label>
      <label><input id="rotateTokens" type="checkbox" class="inline-check"> 관리자 토큰과 Desktop Sync Key 재발급</label>
      <button onclick="runSetup()">Google 저장소 만들기</button>
      <pre id="result"></pre>
    </section>
  </main>
  <script>
    function runSetup() {
      const payload = {
        setupKey: document.getElementById('setupKey').value,
        school_name: document.getElementById('schoolName').value,
        admin_email: document.getElementById('adminEmail').value,
        rooms: document.getElementById('initialRooms').value.split('\n'),
        adminToken: document.getElementById('adminToken').value,
        rotateTokens: document.getElementById('rotateTokens').checked
      };
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('result').textContent = JSON.stringify(res, null, 2);
        })
        .withFailureHandler(function(err) {
          document.getElementById('result').textContent = err.message || String(err);
        })
        .setupInitializeForUi(payload);
    }
  </script>
</body>
</html>
