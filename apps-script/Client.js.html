<script>
const STATUS_NORMAL = '이상 무';
const STATUS_ABNORMAL = '이상 유';
const ALLOWED_FILE_MIME = {
  'image/png': true,
  'image/jpeg': true,
  'image/jpg': true,
  'image/gif': true,
  'image/webp': true,
  'image/heic': true,
  'image/heif': true,
  'application/pdf': true
};
const PENDING_TTL_MS = 24 * 60 * 60 * 1000;
let submitInFlight = false;

function qs(id) { return document.getElementById(id); }
function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}
function textEl(tag, text, className) {
  const el = document.createElement(tag);
  el.textContent = text == null ? '' : String(text);
  if (className) el.className = className;
  return el;
}
function safeAttachmentUrl(value) {
  const url = String(value || '');
  if (/^https:\/\/(drive|docs)\.google\.com\//.test(url)) return url;
  return '#';
}
function recordId() {
  return 'rec_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}
function readFileAsBase64(file) {
  return new Promise(function(resolve, reject) {
    if (!file) return resolve(null);
    if (file.size > 5 * 1024 * 1024) return reject(new Error('파일은 5MB 이하만 첨부할 수 있습니다.'));
    if (!ALLOWED_FILE_MIME[String(file.type || '').toLowerCase()]) {
      return reject(new Error('이미지 또는 PDF 파일만 첨부할 수 있습니다.'));
    }
    const reader = new FileReader();
    reader.onload = function() {
      const text = reader.result || '';
      resolve({ file_name: file.name, mime_type: file.type, file_size: file.size, base64: String(text).split(',')[1] });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function gas(functionName, payload) {
  return new Promise(function(resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](payload || {});
  });
}
async function initSubmitPage() {
  qs('recordId').value = recordId();
  const params = window.__PARAMS__ || {};
  try {
    const data = await gas('getSubmitBootstrapForUi', params);
    window.__BOOTSTRAP__ = data;
    // 관찰시간: 점검 화면을 연 시각(KST). 서버 접수시간과 구분해 지연 제출 판정에 쓴다.
    window.__OBSERVED_AT__ = kstWallMinute_(new Date());
    qs('title').textContent = '보안점검표 - ' + data.room.room_name;
    renderPeople(data.people || []);
    renderItems(data.items || []);
    resendPending();
  } catch (err) {
    qs('offlineBox').classList.remove('hidden');
    qs('offlineBox').textContent = '점검표 정보를 불러오지 못했습니다. QR 주소 또는 네트워크를 확인하세요. ' + (err.message || err);
  }
  qs('submitForm').addEventListener('submit', submitForm);
}
function showSubmitInitError_(err) {
  try {
    const box = qs('offlineBox');
    if (!box) return;
    box.classList.remove('hidden');
    const detail = (err && err.message) || String(err || '');
    box.textContent = '제출 화면을 초기화하지 못했습니다. QR 주소 또는 네트워크를 확인하세요. ' + detail;
  } catch (ignored) {}
}
function startSubmitPage_(initializer) {
  const run = (typeof initializer === 'function') ? initializer : initSubmitPage;
  return Promise.resolve().then(run).catch(showSubmitInitError_);
}
function renderPeople(people) {
  people.forEach(function(p) {
    const option = new Option(p.person_name, p.person_id + '|' + p.person_name);
    if (p.role_type === 'duty') qs('dutySelect').add(option);
    else qs('responsibleSelect').add(option);
  });
}
function renderItems(items) {
  const tbody = qs('itemsTable').querySelector('tbody');
  clearNode(tbody);
  items.forEach(function(item) {
    const tr = document.createElement('tr');
    const nameCell = textEl('td', item.item_name);
    const statusCell = document.createElement('td');
    statusCell.className = 'status';
    // 미선택이 기본이다. '전체 이상 없음' 버튼을 명시적으로 눌러야 일괄 선택된다.
    const normalLabel = document.createElement('label');
    const normal = document.createElement('input');
    normal.type = 'radio';
    normal.name = 'status_' + item.item_key;
    normal.value = STATUS_NORMAL;
    normalLabel.appendChild(normal);
    normalLabel.appendChild(document.createTextNode(' ' + STATUS_NORMAL));
    const abnormalLabel = document.createElement('label');
    const abnormal = document.createElement('input');
    abnormal.type = 'radio';
    abnormal.name = 'status_' + item.item_key;
    abnormal.value = STATUS_ABNORMAL;
    abnormalLabel.appendChild(abnormal);
    abnormalLabel.appendChild(document.createTextNode(' ' + STATUS_ABNORMAL));
    statusCell.appendChild(normalLabel);
    statusCell.appendChild(abnormalLabel);
    const fileCell = document.createElement('td');
    fileCell.className = 'file-cell';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'file_' + item.item_key;
    fileInput.accept = 'image/*,image/heic,image/heif,application/pdf';
    fileCell.appendChild(fileInput);
    tr.appendChild(nameCell);
    tr.appendChild(statusCell);
    tr.appendChild(fileCell);
    tbody.appendChild(tr);
    tr.querySelectorAll('input[type=radio]').forEach(function(radio) {
      radio.addEventListener('change', function() {
        tr.querySelector('.file-cell').classList.toggle('issue', radio.value === STATUS_ABNORMAL && radio.checked);
      });
    });
  });
  const bar = document.createElement('div');
  bar.className = 'bulk-bar';
  const allNormal = document.createElement('button');
  allNormal.type = 'button';
  allNormal.textContent = '전체 이상 없음으로 표시';
  allNormal.addEventListener('click', function() {
    items.forEach(function(item) {
      const radios = Array.prototype.slice.call(document.getElementsByName('status_' + item.item_key));
      radios.forEach(function(radio) { radio.checked = (radio.value === STATUS_NORMAL); });
    });
  });
  bar.appendChild(allNormal);
  bar.appendChild(textEl('span', '각 항목을 직접 확인한 뒤 눌러주세요.', 'hint'));
  tbody.parentElement.parentElement.insertBefore(bar, tbody.parentElement.nextSibling);
}
function kstWallMinute_(date) {
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(date || new Date());
    const get = function(t) { const p = parts.find(function(x) { return x.type === t; }); return p ? p.value : ''; };
    return get('year') + '-' + get('month') + '-' + get('day') + 'T' + get('hour') + ':' + get('minute');
  } catch (err) {
    return '';
  }
}
async function submitForm(event) {
  event.preventDefault();
  if (submitInFlight) return;
  submitInFlight = true;
  const submitButton = qs('submitForm').querySelector('button[type=submit]');
  const originalText = submitButton ? submitButton.textContent : '';
  if (submitButton) {
    submitButton.disabled = true;
    submitButton.textContent = '전송 중...';
  }
  let payload = null;
  try {
    payload = await buildSubmitPayload_();
    const result = await gas('submitInspectionForUi', payload);
    showDone(result);
    localStorage.removeItem('qr_pending_' + payload.record_id);
  } catch (err) {
    if (payload) {
      if (storePending_(payload)) {
        alert('전송 실패로 임시 저장했습니다. 이 화면을 다시 열면 24시간 안에 재전송을 시도합니다.');
      } else {
        alert('전송에 실패했고 휴대폰 임시 저장 공간이 부족해 보관하지 못했습니다. 첨부파일을 줄인 뒤 다시 시도하세요.');
      }
    } else {
      alert(err.message || err);
    }
  } finally {
    submitInFlight = false;
    if (submitButton) {
      submitButton.disabled = false;
      submitButton.textContent = originalText;
    }
  }
}
async function buildSubmitPayload_() {
  const responsible = qs('responsibleSelect').value;
  const duty = qs('dutySelect').value;
  if (!responsible && !duty) throw new Error('담당자 또는 당직자를 선택하세요.');
  if (responsible && duty) throw new Error('담당자와 당직자 중 한 명만 선택하세요.');
  const selected = (responsible || duty).split('|');
  const roleType = duty ? 'duty' : 'responsible';
  const items = window.__BOOTSTRAP__.items || [];
  const status = {};
  const attachments = {};
  for (const item of items) {
    const radios = Array.prototype.slice.call(document.getElementsByName('status_' + item.item_key));
    const checked = radios.find(function(radio) { return radio.checked; });
    // 미선택은 서버로 보내지 않는다. 서버가 빠진 항목을 거부한다.
    if (checked) status[item.item_key] = checked.value;
    const fileInput = qs('file_' + item.item_key);
    if (fileInput && fileInput.files[0]) attachments[item.item_key] = await readFileAsBase64(fileInput.files[0]);
  }
  const payload = {
    record_id: qs('recordId').value,
    room_id: window.__PARAMS__.roomId,
    submit_token: window.__PARAMS__.submitToken,
    person_id: selected[0],
    person_name: selected[1],
    role_type: roleType,
    status_json: status,
    remarks: qs('remarks').value,
    attachments: attachments,
    observed_at: window.__OBSERVED_AT__ || '',
    client_info: { userAgent: navigator.userAgent }
  };
  try {
    JSON.stringify(payload);
  } catch (err) {
    throw new Error('임시 저장할 수 없는 입력값이 있습니다.');
  }
  return payload;
}
function storePending_(payload) {
  try {
    localStorage.setItem('qr_pending_' + payload.record_id, JSON.stringify({
      saved_at: new Date().toISOString(),
      expires_at: Date.now() + PENDING_TTL_MS,
      payload: payload
    }));
    return true;
  } catch (err) {
    return false;
  }
}
function showDone(result) {
  qs('submitForm').classList.add('hidden');
  const done = qs('done');
  done.classList.remove('hidden');
  clearNode(done);
  done.appendChild(textEl('h2', '제출 완료'));
  done.appendChild(textEl('p', '기록번호: ' + result.record_id));
  done.appendChild(textEl('p', result.abnormal ? '이상 있음으로 제출되었습니다.' : '이상 없음으로 제출되었습니다.'));
}
async function resendPending() {
  const keys = Object.keys(localStorage).filter(function(k) { return k.indexOf('qr_pending_') === 0; });
  let expired = 0;
  let failed = 0;
  for (const key of keys) {
    try {
      const stored = JSON.parse(localStorage.getItem(key));
      const payload = stored && stored.payload ? stored.payload : stored;
      if (stored && stored.expires_at && Date.now() > Number(stored.expires_at)) {
        localStorage.removeItem(key);
        expired++;
        continue;
      }
      await gas('submitInspectionForUi', payload);
      localStorage.removeItem(key);
    } catch (err) {
      failed++;
    }
  }
  // 만료 삭제·재전송 실패를 사용자에게 반드시 알린다. 완료로 오인시키지 않는다.
  if (expired || failed) {
    const box = qs('offlineBox');
    box.classList.remove('hidden');
    const lines = [];
    if (failed) lines.push('미전송 자료 ' + failed + '건이 있습니다. 네트워크가 복구되면 이 화면을 다시 열어 재전송하세요.');
    if (expired) lines.push('보관기간(24시간)이 지나 삭제된 미전송 자료 ' + expired + '건이 있습니다. 해당 점검은 다시 제출하세요.');
    clearNode(box);
    lines.forEach(function(line) { box.appendChild(textEl('p', line)); });
    const clearButton = document.createElement('button');
    clearButton.type = 'button';
    clearButton.textContent = '미전송 자료 모두 삭제';
    clearButton.addEventListener('click', function() {
      if (!window.confirm('전송되지 않은 자료를 모두 삭제할까요? 삭제 후에는 복구할 수 없습니다.')) return;
      Object.keys(localStorage).filter(function(k) { return k.indexOf('qr_pending_') === 0; })
        .forEach(function(k) { localStorage.removeItem(k); });
      box.classList.add('hidden');
    });
    box.appendChild(clearButton);
  }
}
async function loadAdmin() {
  const payload = adminFilterPayload();
  try {
    const data = await gas('adminListForUi', payload);
    // 서버 날짜(KST)를 우선 사용한다. 클라이언트 UTC 계산으로 오늘을 구하지 않는다.
    if (data && data.server_date && !qs('adminStartDate').value) {
      qs('adminStartDate').value = data.server_date;
      qs('adminEndDate').value = data.server_date;
      payload.start_date = data.server_date;
      payload.end_date = data.server_date;
    }
    renderAdminRooms(data.rooms || []);
    renderAdminRows(data.submissions || []);
  } catch (err) {
    alert(err.message || err);
  }
}
async function initAdminPage() {
  await loadAdmin();
  await loadRooms();
}
function submitBaseUrl_() {
  // 서버가 알려준 공개 /exec 주소를 우선 사용한다.
  // iframe 내부 주소(window.location)는 1회용 샌드박스 주소라 QR·공유에 쓰면 안 된다.
  if (window.__EXEC_URL__) return String(window.__EXEC_URL__).split('?')[0];
  return String(window.location.href).split('?')[0];
}
function roomSubmitUrl_(room) {
  return submitBaseUrl_() + '?roomId=' + encodeURIComponent(room.room_id) +
    '&submitToken=' + encodeURIComponent(room.submit_token);
}
async function loadRooms() {
  try {
    const data = await gas('adminRoomsForUi', { adminToken: qs('adminToken').value });
    renderRooms(data.rooms || []);
  } catch (err) {
    alert(err.message || err);
  }
}
function renderRooms(rooms) {
  const tbody = qs('roomTable').querySelector('tbody');
  clearNode(tbody);
  rooms.forEach(function(room) {
    const tr = document.createElement('tr');
    tr.appendChild(textEl('td', room.room_name));
    tr.appendChild(textEl('td', room.active ? '사용' : '중지'));
    tr.appendChild(textEl('td', 'v' + room.token_version));
    const urlCell = document.createElement('td');
    const link = document.createElement('a');
    link.href = roomSubmitUrl_(room);
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '제출 주소 열기';
    urlCell.appendChild(link);
    const copy = document.createElement('input');
    copy.readOnly = true;
    copy.value = roomSubmitUrl_(room);
    copy.setAttribute('aria-label', room.room_name + ' 제출 주소');
    urlCell.appendChild(copy);
    tr.appendChild(urlCell);
    const actionCell = document.createElement('td');
    const renameButton = document.createElement('button');
    renameButton.type = 'button';
    renameButton.textContent = '이름 변경';
    renameButton.addEventListener('click', function() { renameRoom(room); });
    const reissueButton = document.createElement('button');
    reissueButton.type = 'button';
    reissueButton.textContent = 'QR 재발급';
    reissueButton.addEventListener('click', function() { reissueRoom(room); });
    actionCell.appendChild(renameButton);
    actionCell.appendChild(reissueButton);
    tr.appendChild(actionCell);
    tbody.appendChild(tr);
  });
}
async function createRoom() {
  const name = window.prompt('새 장소 이름:');
  if (!name || !name.trim()) return;
  await gas('adminSaveRoomForUi', { room_name: name.trim(), adminToken: qs('adminToken').value });
  await loadRooms();
}
async function renameRoom(room) {
  const name = window.prompt('장소 이름 변경 (QR은 그대로 유지됩니다):', room.room_name);
  if (!name || !name.trim() || name.trim() === room.room_name) return;
  await gas('adminSaveRoomForUi', { room_id: room.room_id, room_name: name.trim(), adminToken: qs('adminToken').value });
  await loadRooms();
  await loadAdmin();
}
async function reissueRoom(room) {
  if (!window.confirm('"' + room.room_name + '"의 QR을 새로 발급할까요? 기존 QR은 즉시 사용할 수 없게 됩니다.')) return;
  const result = await gas('reissueRoomTokenForUi', { room_id: room.room_id, adminToken: qs('adminToken').value });
  alert('재발급 완료 (토큰 버전 v' + result.token_version + '). 부착된 QR을 교체하세요.');
  await loadRooms();
}
function adminFilterPayload() {
  return {
    start_date: qs('adminStartDate').value,
    end_date: qs('adminEndDate').value,
    room_id: qs('adminRoom').value,
    state: qs('adminState').value,
    adminToken: qs('adminToken').value
  };
}
function renderAdminRooms(rooms) {
  const select = qs('adminRoom');
  const current = select.value;
  select.innerHTML = '<option value="">전체</option>';
  rooms.forEach(function(room) {
    const option = new Option(room.room_name, room.room_id);
    select.add(option);
  });
  if (current) select.value = current;
}
function renderAdminRows(rows) {
  const tbody = qs('adminTable').querySelector('tbody');
  clearNode(tbody);
  qs('adminSummary').textContent = '조회 결과: ' + rows.length + '건';
  rows.forEach(function(row) {
    const abnormal = row.abnormal === true || row.abnormal === 'TRUE' || row.abnormal === 'true' || row.abnormal === 1 || row.abnormal === '1';
    const verified = row.admin_verified === true || row.admin_verified === 'TRUE' || row.admin_verified === 'true' || row.admin_verified === 1 || row.admin_verified === '1';
    const tr = document.createElement('tr');
    tr.appendChild(textEl('td', row.submitted_at));
    tr.appendChild(textEl('td', row.room_name));
    tr.appendChild(textEl('td', row.person_name));
    tr.appendChild(textEl('td', abnormal ? '이상 있음' : '이상 없음', abnormal ? 'bad' : 'ok'));
    tr.appendChild(textEl('td', verified ? '확인' : '미확인'));
    const actionCell = document.createElement('td');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '상세보기';
    button.addEventListener('click', function() { loadDetail(row.record_id); });
    actionCell.appendChild(button);
    tr.appendChild(actionCell);
    tbody.appendChild(tr);
  });
}
async function loadDetail(recordId) {
  const payload = { record_id: recordId, adminToken: qs('adminToken').value };
  const data = await gas('adminDetailForUi', payload);
  const record = data.record;
  const attachments = data.attachments || [];
  const detail = qs('detail');
  detail.classList.remove('hidden');
  clearNode(detail);
  detail.appendChild(textEl('h2', '상세보기'));
  if (record.save_state && String(record.save_state) === 'PARTIAL') {
    detail.appendChild(textEl('p', '일부 저장 상태(PARTIAL): 첨부 또는 기록 처리가 끝나지 않았습니다. 첨부 목록을 확인하고 필요하면 재제출을 안내하세요.', 'bad'));
    const reconcileButton = document.createElement('button');
    reconcileButton.type = 'button';
    reconcileButton.textContent = '첨부 확인 후 복구 확정';
    reconcileButton.addEventListener('click', function() { reconcileDetail(record.record_id); });
    detail.appendChild(reconcileButton);
    const discardButton = document.createElement('button');
    discardButton.type = 'button';
    discardButton.textContent = '오류 기록으로 정리';
    discardButton.addEventListener('click', function() { discardDetail(record.record_id); });
    detail.appendChild(discardButton);
  }
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(record, null, 2);
  detail.appendChild(pre);
  detail.appendChild(textEl('h3', '첨부파일'));
  if (attachments.length) {
    const list = document.createElement('ul');
    attachments.forEach(function(file) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = safeAttachmentUrl(file.drive_url);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = file.file_name || '첨부파일';
      item.appendChild(link);
      list.appendChild(item);
    });
    detail.appendChild(list);
  } else {
    detail.appendChild(textEl('p', '첨부파일 없음'));
  }
  const memo = document.createElement('textarea');
  memo.id = 'adminMemo';
  memo.placeholder = '관리자 메모';
  detail.appendChild(memo);
  const verifyButton = document.createElement('button');
  verifyButton.type = 'button';
  verifyButton.textContent = '개별확인';
  verifyButton.addEventListener('click', function() { verifyDetail(record.record_id); });
  detail.appendChild(verifyButton);
}
async function verifyDetail(recordId) {
  await gas('adminVerifyForUi', { record_id: recordId, admin_memo: qs('adminMemo').value, adminToken: qs('adminToken').value });
  await loadAdmin();
}
async function reconcileDetail(recordId) {
  if (!window.confirm('첨부 목록을 확인했으면 복구 확정합니다. 계속할까요?')) return;
  await gas('adminReconcileForUi', { record_id: recordId, adminToken: qs('adminToken').value });
  await loadAdmin();
  await loadDetail(recordId);
}
async function discardDetail(recordId) {
  if (!window.confirm('이 기록을 오류 정리 상태로 바꿀까요? 일반 조회에서 제외됩니다.')) return;
  await gas('adminDiscardPartialForUi', { record_id: recordId, confirm: true, adminToken: qs('adminToken').value });
  await loadAdmin();
}
async function bulkVerify() {
  const payload = adminFilterPayload();
  payload.state = '';
  const result = await gas('adminBulkVerifyForUi', payload);
  alert('일괄확인 완료: ' + result.count + '건');
  await loadAdmin();
}
async function openCsv() {
  const payload = adminFilterPayload();
  try {
    const result = await gas('adminCsvForUi', payload);
    const blob = new Blob([result.csv || ''], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = result.file_name || 'qr_security_submissions.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message || err);
  }
}
</script>
