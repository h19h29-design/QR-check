<script>
const STATUS_NORMAL = '이상 무';
const STATUS_ABNORMAL = '이상 유';
const ALLOWED_FILE_MIME = {
  'image/png': true,
  'image/jpeg': true,
  'image/jpg': true,
  'image/gif': true,
  'image/webp': true,
  'image/heic': true,
  'image/heif': true,
  'application/pdf': true
};

function qs(id) { return document.getElementById(id); }
function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}
function textEl(tag, text, className) {
  const el = document.createElement(tag);
  el.textContent = text == null ? '' : String(text);
  if (className) el.className = className;
  return el;
}
function safeAttachmentUrl(value) {
  const url = String(value || '');
  if (/^https:\/\/(drive|docs)\.google\.com\//.test(url)) return url;
  return '#';
}
function recordId() {
  return 'rec_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}
function readFileAsBase64(file) {
  return new Promise(function(resolve, reject) {
    if (!file) return resolve(null);
    if (file.size > 5 * 1024 * 1024) return reject(new Error('파일은 5MB 이하만 첨부할 수 있습니다.'));
    if (!ALLOWED_FILE_MIME[String(file.type || '').toLowerCase()]) {
      return reject(new Error('이미지 또는 PDF 파일만 첨부할 수 있습니다.'));
    }
    const reader = new FileReader();
    reader.onload = function() {
      const text = reader.result || '';
      resolve({ file_name: file.name, mime_type: file.type, file_size: file.size, base64: String(text).split(',')[1] });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function gas(functionName, payload) {
  return new Promise(function(resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](payload || {});
  });
}
async function initSubmitPage() {
  qs('recordId').value = recordId();
  const params = window.__PARAMS__ || {};
  try {
    const data = await gas('getSubmitBootstrapForUi', params);
    window.__BOOTSTRAP__ = data;
    qs('title').textContent = '보안점검표 - ' + data.room.room_name;
    renderPeople(data.people || []);
    renderItems(data.items || []);
    resendPending();
  } catch (err) {
    qs('offlineBox').classList.remove('hidden');
    qs('offlineBox').textContent = '점검표 정보를 불러오지 못했습니다. QR 주소 또는 네트워크를 확인하세요. ' + (err.message || err);
  }
  qs('submitForm').addEventListener('submit', submitForm);
}
function renderPeople(people) {
  people.forEach(function(p) {
    const option = new Option(p.person_name, p.person_id + '|' + p.person_name);
    if (p.role_type === 'duty') qs('dutySelect').add(option);
    else qs('responsibleSelect').add(option);
  });
}
function renderItems(items) {
  const tbody = qs('itemsTable').querySelector('tbody');
  clearNode(tbody);
  items.forEach(function(item) {
    const tr = document.createElement('tr');
    const nameCell = textEl('td', item.item_name);
    const statusCell = document.createElement('td');
    statusCell.className = 'status';
    const normalLabel = document.createElement('label');
    const normal = document.createElement('input');
    normal.type = 'radio';
    normal.name = 'status_' + item.item_key;
    normal.value = STATUS_NORMAL;
    normal.checked = true;
    normalLabel.appendChild(normal);
    normalLabel.appendChild(document.createTextNode(' ' + STATUS_NORMAL));
    const abnormalLabel = document.createElement('label');
    const abnormal = document.createElement('input');
    abnormal.type = 'radio';
    abnormal.name = 'status_' + item.item_key;
    abnormal.value = STATUS_ABNORMAL;
    abnormalLabel.appendChild(abnormal);
    abnormalLabel.appendChild(document.createTextNode(' ' + STATUS_ABNORMAL));
    statusCell.appendChild(normalLabel);
    statusCell.appendChild(abnormalLabel);
    const fileCell = document.createElement('td');
    fileCell.className = 'file-cell';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'file_' + item.item_key;
    fileInput.accept = 'image/*,image/heic,image/heif,application/pdf';
    fileCell.appendChild(fileInput);
    tr.appendChild(nameCell);
    tr.appendChild(statusCell);
    tr.appendChild(fileCell);
    tbody.appendChild(tr);
    tr.querySelectorAll('input[type=radio]').forEach(function(radio) {
      radio.addEventListener('change', function() {
        tr.querySelector('.file-cell').classList.toggle('issue', radio.value === STATUS_ABNORMAL && radio.checked);
      });
    });
  });
}
async function submitForm(event) {
  event.preventDefault();
  const responsible = qs('responsibleSelect').value;
  const duty = qs('dutySelect').value;
  if (!responsible && !duty) { alert('담당자 또는 당직자를 선택하세요.'); return; }
  const selected = (responsible || duty).split('|');
  const roleType = duty ? 'duty' : 'responsible';
  const items = window.__BOOTSTRAP__.items || [];
  const status = {};
  const attachments = {};
  for (const item of items) {
    const radios = Array.prototype.slice.call(document.getElementsByName('status_' + item.item_key));
    const checked = radios.find(function(radio) { return radio.checked; });
    status[item.item_key] = checked ? checked.value : STATUS_NORMAL;
    const fileInput = qs('file_' + item.item_key);
    if (fileInput && fileInput.files[0]) attachments[item.item_key] = await readFileAsBase64(fileInput.files[0]);
  }
  const payload = {
    record_id: qs('recordId').value,
    room_id: window.__PARAMS__.roomId,
    submit_token: window.__PARAMS__.submitToken,
    person_id: selected[0],
    person_name: selected[1],
    role_type: roleType,
    status_json: status,
    remarks: qs('remarks').value,
    attachments: attachments,
    client_info: { userAgent: navigator.userAgent }
  };
  try {
    const result = await gas('submitInspectionForUi', payload);
    showDone(result);
    localStorage.removeItem('qr_pending_' + payload.record_id);
  } catch (err) {
    localStorage.setItem('qr_pending_' + payload.record_id, JSON.stringify(payload));
    alert('전송 실패로 임시 저장했습니다. 이 화면을 다시 열면 재전송을 시도합니다.');
  }
}
function showDone(result) {
  qs('submitForm').classList.add('hidden');
  const done = qs('done');
  done.classList.remove('hidden');
  clearNode(done);
  done.appendChild(textEl('h2', '제출 완료'));
  done.appendChild(textEl('p', '기록번호: ' + result.record_id));
  done.appendChild(textEl('p', result.abnormal ? '이상 있음으로 제출되었습니다.' : '이상 없음으로 제출되었습니다.'));
}
async function resendPending() {
  const keys = Object.keys(localStorage).filter(function(k) { return k.indexOf('qr_pending_') === 0; });
  for (const key of keys) {
    try {
      const payload = JSON.parse(localStorage.getItem(key));
      await gas('submitInspectionForUi', payload);
      localStorage.removeItem(key);
    } catch (err) {
      qs('offlineBox').classList.remove('hidden');
      qs('offlineBox').textContent = '미전송 자료가 있습니다. 네트워크가 복구되면 다시 시도하세요.';
    }
  }
}
async function loadAdmin() {
  const payload = adminFilterPayload();
  try {
    const data = await gas('adminListForUi', payload);
    renderAdminRooms(data.rooms || []);
    renderAdminRows(data.submissions || []);
  } catch (err) {
    alert(err.message || err);
  }
}
async function initAdminPage() {
  const today = new Date().toISOString().slice(0, 10);
  qs('adminStartDate').value = today;
  qs('adminEndDate').value = today;
  await loadAdmin();
}
function adminFilterPayload() {
  return {
    start_date: qs('adminStartDate').value,
    end_date: qs('adminEndDate').value,
    room_id: qs('adminRoom').value,
    state: qs('adminState').value,
    adminToken: qs('adminToken').value
  };
}
function renderAdminRooms(rooms) {
  const select = qs('adminRoom');
  const current = select.value;
  select.innerHTML = '<option value="">전체</option>';
  rooms.forEach(function(room) {
    const option = new Option(room.room_name, room.room_id);
    select.add(option);
  });
  if (current) select.value = current;
}
function renderAdminRows(rows) {
  const tbody = qs('adminTable').querySelector('tbody');
  clearNode(tbody);
  qs('adminSummary').textContent = '조회 결과: ' + rows.length + '건';
  rows.forEach(function(row) {
    const abnormal = row.abnormal === true || row.abnormal === 'TRUE' || row.abnormal === 'true' || row.abnormal === 1 || row.abnormal === '1';
    const verified = row.admin_verified === true || row.admin_verified === 'TRUE' || row.admin_verified === 'true' || row.admin_verified === 1 || row.admin_verified === '1';
    const tr = document.createElement('tr');
    tr.appendChild(textEl('td', row.submitted_at));
    tr.appendChild(textEl('td', row.room_name));
    tr.appendChild(textEl('td', row.person_name));
    tr.appendChild(textEl('td', abnormal ? '이상 있음' : '이상 없음', abnormal ? 'bad' : 'ok'));
    tr.appendChild(textEl('td', verified ? '확인' : '미확인'));
    const actionCell = document.createElement('td');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '상세보기';
    button.addEventListener('click', function() { loadDetail(row.record_id); });
    actionCell.appendChild(button);
    tr.appendChild(actionCell);
    tbody.appendChild(tr);
  });
}
async function loadDetail(recordId) {
  const payload = { record_id: recordId, adminToken: qs('adminToken').value };
  const data = await gas('adminDetailForUi', payload);
  const record = data.record;
  const attachments = data.attachments || [];
  const detail = qs('detail');
  detail.classList.remove('hidden');
  clearNode(detail);
  detail.appendChild(textEl('h2', '상세보기'));
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(record, null, 2);
  detail.appendChild(pre);
  detail.appendChild(textEl('h3', '첨부파일'));
  if (attachments.length) {
    const list = document.createElement('ul');
    attachments.forEach(function(file) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = safeAttachmentUrl(file.drive_url);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = file.file_name || '첨부파일';
      item.appendChild(link);
      list.appendChild(item);
    });
    detail.appendChild(list);
  } else {
    detail.appendChild(textEl('p', '첨부파일 없음'));
  }
  const memo = document.createElement('textarea');
  memo.id = 'adminMemo';
  memo.placeholder = '관리자 메모';
  detail.appendChild(memo);
  const verifyButton = document.createElement('button');
  verifyButton.type = 'button';
  verifyButton.textContent = '개별확인';
  verifyButton.addEventListener('click', function() { verifyDetail(record.record_id); });
  detail.appendChild(verifyButton);
}
async function verifyDetail(recordId) {
  await gas('adminVerifyForUi', { record_id: recordId, admin_memo: qs('adminMemo').value, adminToken: qs('adminToken').value });
  await loadAdmin();
}
async function bulkVerify() {
  const payload = adminFilterPayload();
  payload.state = '';
  const result = await gas('adminBulkVerifyForUi', payload);
  alert('일괄확인 완료: ' + result.count + '건');
  await loadAdmin();
}
async function openCsv() {
  const payload = adminFilterPayload();
  try {
    const result = await gas('adminCsvForUi', payload);
    const blob = new Blob([result.csv || ''], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = result.file_name || 'qr_security_submissions.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message || err);
  }
}
</script>
