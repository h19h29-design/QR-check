<style>
* { box-sizing: border-box; font-family: 'Malgun Gothic', system-ui, sans-serif; }
body { margin: 0; background: #f4f6f8; color: #17202a; font-size: 18px; line-height: 1.45; }
.container { max-width: 820px; margin: 0 auto; padding: 18px; }
.container.wide { max-width: 1120px; }
h1 { font-size: 28px; margin: 12px 0 18px; padding-bottom: 10px; border-bottom: 3px solid #2b6cb0; }
.panel { background: #fff; border: 1px solid #d8dee4; border-radius: 6px; padding: 16px; margin-bottom: 14px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
label { display: block; font-weight: 700; margin: 10px 0; }
input, select, textarea { width: 100%; min-height: 48px; padding: 10px; border: 1px solid #c9d1d9; border-radius: 4px; font-size: 18px; margin-top: 6px; }
textarea { min-height: 92px; resize: vertical; }
button, .button { display: inline-block; background: #2b6cb0; color: #fff; border: 0; border-radius: 4px; padding: 13px 16px; font-size: 20px; font-weight: 700; text-decoration: none; cursor: pointer; }
button:hover, .button:hover { background: #1f5a96; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { border-bottom: 1px solid #e5e7eb; padding: 12px; text-align: left; vertical-align: top; }
th { background: #f1f5f9; }
.status { display: inline-flex; gap: 10px; align-items: center; }
.status label { font-weight: 400; margin: 0; }
.file-cell.issue { background: #fff7ed; }
.divider { text-align: center; color: #6b7280; font-weight: 700; margin: 8px; }
.notice { padding: 12px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; margin-bottom: 12px; }
.hidden { display: none; }
.bad { color: #b91c1c; font-weight: 700; }
.ok { color: #047857; font-weight: 700; }
pre { white-space: pre-wrap; word-break: break-all; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; }
@media (max-width: 640px) {
  .container { padding: 10px; }
  table, thead, tbody, tr, th, td { display: block; width: 100%; }
  thead { display: none; }
  tr { border: 1px solid #e5e7eb; margin-bottom: 10px; border-radius: 6px; overflow: hidden; }
  td { border: 0; }
  button, .button { width: 100%; text-align: center; margin-top: 6px; }
}
</style>
