<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">QR 보안점검표 작동 원리</title>
  <desc id="desc">홈페이지에서 학교 Google 계정에 독립된 Apps Script, Sheets, Drive를 설치한 뒤 점검자가 QR로 제출하고 관리자가 확인하는 흐름</desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#173B68"/></linearGradient>
    <linearGradient id="mintGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDF9EF"/><stop offset="1" stop-color="#F0FCF8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.10"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#245AF2"/></marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#18A779"/></marker>
    <style>
      .font{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}.title{font-size:38px;font-weight:800;fill:#fff;letter-spacing:-1px}.subtitle{font-size:17px;font-weight:500;fill:#dce8fa}.section-label{font-size:14px;font-weight:800;letter-spacing:1.3px;fill:#245af2}.section-title{font-size:25px;font-weight:800;fill:#0b1f3a}.card-title{font-size:18px;font-weight:800;fill:#0b1f3a}.card-body{font-size:14px;font-weight:500;fill:#52637a}.small{font-size:12.5px;font-weight:500;fill:#65758b}.pill{font-size:12px;font-weight:800;fill:#245af2}.white-title{font-size:21px;font-weight:800;fill:#fff}.white-body{font-size:14px;font-weight:500;fill:#dce8fa}.node-title{font-size:16px;font-weight:800;fill:#0b1f3a}.node-body{font-size:12.5px;font-weight:500;fill:#52637a}.number{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}.arrow-label{font-size:12px;font-weight:800;fill:#245af2}.line-blue{fill:none;stroke:#245af2;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}.line-mint{fill:none;stroke:#18a779;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowMint)}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#F4F7FB"/>
  <rect x="28" y="28" width="1384" height="142" rx="26" fill="url(#headerGradient)"/>
  <circle cx="89" cy="83" r="28" fill="#5ED6A2"/><path d="M75 70h28v28H75z M81 76h7v7h-7z M92 76h5v5h-5z M81 87h5v5h-5z M91 86h6v7h-6z" fill="#0B1F3A"/>
  <text x="137" y="88" class="font title">QR 보안점검표 작동 원리</text>
  <text x="138" y="121" class="font subtitle">설치 안내센터는 설치만 돕고, 실제 점검 데이터는 각 학교의 Google 계정이 직접 소유합니다.</text>
  <rect x="1134" y="71" width="223" height="54" rx="27" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".24"/><circle cx="1167" cy="98" r="14" fill="#5ED6A2"/><path d="M1161 98l4 4 8-9" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1192" y="104" class="font" font-size="15" font-weight="800" fill="#fff">학교별 독립 운영</text>

  <g aria-label="처음 한 번 설치하는 흐름">
    <text x="56" y="218" class="font section-label">처음 1회</text><text x="56" y="250" class="font section-title">학교용 시스템을 만드는 과정</text><text x="56" y="277" class="font card-body">학교 관리자 계정으로 순서대로 진행합니다. 앞 단계가 끝나야 다음 단계가 열립니다.</text>
    <rect x="56" y="305" width="282" height="154" rx="20" fill="#fff" stroke="#D7E0EE" filter="url(#shadow)"/><circle cx="84" cy="333" r="16" fill="#245AF2"/><text x="84" y="334" class="font number">1</text><rect x="282" y="320" width="38" height="24" rx="12" fill="#EEF3FF"/><text x="301" y="337" class="font pill" text-anchor="middle">WEB</text><text x="78" y="377" class="font card-title">설치 안내센터</text><text x="78" y="404" class="font card-body">학교 정보 입력</text><text x="78" y="427" class="font card-body">qr-safe.h19h19.com</text>
    <rect x="402" y="305" width="282" height="154" rx="20" fill="#fff" stroke="#D7E0EE" filter="url(#shadow)"/><circle cx="430" cy="333" r="16" fill="#245AF2"/><text x="430" y="334" class="font number">2</text><rect x="592" y="320" width="74" height="24" rx="12" fill="#EEF3FF"/><text x="629" y="337" class="font pill" text-anchor="middle">GOOGLE</text><text x="424" y="377" class="font card-title">학교 계정 연결</text><text x="424" y="404" class="font card-body">Google 로그인 및 권한 승인</text><text x="424" y="427" class="font card-body">학교 관리자 계정 사용</text>
    <rect x="748" y="305" width="282" height="154" rx="20" fill="#fff" stroke="#D7E0EE" filter="url(#shadow)"/><circle cx="776" cy="333" r="16" fill="#245AF2"/><text x="776" y="334" class="font number">3</text><rect x="954" y="320" width="58" height="24" rx="12" fill="#E7FAF3"/><text x="983" y="337" class="font" font-size="12" font-weight="800" fill="#138A66" text-anchor="middle">자동</text><text x="770" y="377" class="font card-title">학교 자원 생성</text><text x="770" y="404" class="font card-body">Apps Script · Sheet · Drive</text><text x="770" y="427" class="font card-body">학교 계정 안에 독립 생성</text>
    <rect x="1094" y="305" width="290" height="154" rx="20" fill="url(#mintGradient)" stroke="#8DE4C5" filter="url(#shadow)"/><circle cx="1122" cy="333" r="16" fill="#18A779"/><text x="1122" y="334" class="font number">4</text><rect x="1292" y="320" width="74" height="24" rx="12" fill="#fff"/><text x="1329" y="337" class="font" font-size="12" font-weight="800" fill="#138A66" text-anchor="middle">사용 준비</text><text x="1116" y="377" class="font card-title">초기 설정·연결 검사</text><text x="1116" y="404" class="font card-body">설정 키로 학교 정보 저장</text><text x="1116" y="427" class="font card-body">검사 성공 후에만 완료</text>
    <path d="M338 382H390" class="line-blue"/><path d="M684 382H736" class="line-blue"/><path d="M1030 382H1082" class="line-blue"/>
  </g>

  <g aria-label="학교 Google 계정이 소유하는 시스템">
    <rect x="56" y="505" width="1328" height="248" rx="24" fill="#0B1F3A"/><rect x="80" y="529" width="196" height="32" rx="16" fill="#5ED6A2"/><text x="178" y="551" class="font" font-size="13" font-weight="900" fill="#0B1F3A" text-anchor="middle">학교 GOOGLE 계정 소유</text><text x="80" y="601" class="font white-title">설치 후에는 학교의 독립 시스템으로 작동합니다</text><text x="80" y="628" class="font white-body">홈페이지가 데이터를 보관하지 않습니다. 아래 세 자원이 서로 연결되어 실제 점검 업무를 처리합니다.</text>
    <rect x="80" y="657" width="354" height="72" rx="16" fill="#fff"/><circle cx="113" cy="693" r="20" fill="#EEF3FF"/><text x="113" y="698" class="font" font-size="20" font-weight="900" fill="#245AF2" text-anchor="middle">A</text><text x="147" y="686" class="font node-title">Google Apps Script</text><text x="147" y="709" class="font node-body">QR 제출·관리자 화면·권한 검사</text>
    <rect x="543" y="657" width="354" height="72" rx="16" fill="#fff"/><circle cx="576" cy="693" r="20" fill="#E7FAF3"/><path d="M566 683h20v20h-20z M571 683v20 M566 690h20 M566 697h20" fill="none" stroke="#18A779" stroke-width="2"/><text x="610" y="686" class="font node-title">Google Sheets</text><text x="610" y="709" class="font node-body">학교 설정·실별 QR·점검 기록</text>
    <rect x="1006" y="657" width="354" height="72" rx="16" fill="#fff"/><circle cx="1039" cy="693" r="20" fill="#FFF5D8"/><path d="M1027 687h10l4 4h12v11h-26z" fill="#F1B82D"/><text x="1073" y="686" class="font node-title">Google Drive</text><text x="1073" y="709" class="font node-body">현장 사진·첨부파일 보관</text>
    <path d="M434 693H531" class="line-mint"/><path d="M897 693H994" class="line-mint"/><text x="482" y="681" class="font" font-size="11.5" font-weight="700" fill="#8DE4C5" text-anchor="middle">기록</text><text x="945" y="681" class="font" font-size="11.5" font-weight="700" fill="#8DE4C5" text-anchor="middle">첨부</text>
  </g>

  <g aria-label="점검자와 관리자의 실제 사용 흐름">
    <text x="56" y="804" class="font section-label">매일 사용</text><text x="56" y="836" class="font section-title">점검 제출부터 관리자 확인까지</text>
    <rect x="56" y="868" width="302" height="124" rx="20" fill="#fff" stroke="#D7E0EE"/><rect x="78" y="889" width="54" height="82" rx="10" fill="#0B1F3A"/><rect x="84" y="898" width="42" height="60" rx="5" fill="#fff"/><path d="M91 905h10v10H91z M108 905h10v10h-10z M91 922h10v10H91z M107 922h5v5h-5z M114 929h5v5h-5z M102 934h5v5h-5z" fill="#245AF2"/><circle cx="105" cy="965" r="3" fill="#5ED6A2"/><text x="153" y="905" class="font card-title">점검자</text><text x="153" y="931" class="font card-body">실별 QR 스캔</text><text x="153" y="954" class="font card-body">상태·특이사항·사진 제출</text><text x="153" y="977" class="font small">Google 로그인 없이 사용 가능</text>
    <rect x="466" y="868" width="508" height="124" rx="20" fill="#EEF3FF" stroke="#B9CAFF"/><circle cx="506" cy="905" r="18" fill="#245AF2"/><text x="506" y="906" class="font number">2</text><text x="537" y="911" class="font card-title">학교 Apps Script가 제출을 처리</text><text x="494" y="941" class="font card-body">QR 토큰 확인 → 점검 결과를 Sheet에 기록 → 사진을 Drive에 저장</text><rect x="494" y="956" width="213" height="23" rx="11.5" fill="#fff"/><text x="600" y="972" class="font" font-size="11.5" font-weight="800" fill="#245AF2" text-anchor="middle">학교 계정 안에서만 처리</text>
    <rect x="1082" y="868" width="302" height="124" rx="20" fill="#fff" stroke="#D7E0EE"/><rect x="1104" y="892" width="74" height="54" rx="7" fill="#0B1F3A"/><rect x="1110" y="898" width="62" height="42" rx="3" fill="#fff"/><path d="M1118 908h45 M1118 918h30 M1118 928h38" stroke="#5ED6A2" stroke-width="4" stroke-linecap="round"/><path d="M1128 953h26 M1141 946v7" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><text x="1198" y="905" class="font card-title">관리자</text><text x="1198" y="931" class="font card-body">학교 계정으로 관리자 접속</text><text x="1198" y="954" class="font card-body">조회·확인·실/QR 관리</text><text x="1198" y="977" class="font small">필요 시 CSV 내보내기</text>
    <path d="M358 930H454" class="line-blue"/><path d="M974 930H1070" class="line-blue"/><circle cx="406" cy="907" r="15" fill="#245AF2"/><text x="406" y="908" class="font number">1</text><text x="406" y="956" class="font arrow-label" text-anchor="middle">제출</text><circle cx="1022" cy="907" r="15" fill="#245AF2"/><text x="1022" y="908" class="font number">3</text><text x="1022" y="956" class="font arrow-label" text-anchor="middle">확인</text>
  </g>

  <rect x="930" y="189" width="454" height="82" rx="18" fill="#fff" stroke="#D7E0EE"/><circle cx="960" cy="230" r="18" fill="#FFF0F0"/><path d="M951 221l18 18 M969 221l-18 18" stroke="#D34545" stroke-width="3" stroke-linecap="round"/><text x="991" y="222" class="font" font-size="15" font-weight="800" fill="#0B1F3A">중앙 데이터 서버 없음</text><text x="991" y="246" class="font small">학교 기록·사진·설정 키를 홈페이지에 모으지 않습니다.</text>
  <text x="56" y="1023" class="font small">※ Google 인증 상태와 학교 Workspace 정책에 따라 계정 연결 또는 권한 승인이 제한될 수 있습니다.</text>
</svg>
